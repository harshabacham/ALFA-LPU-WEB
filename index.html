    <style>
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
      }
      body {
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
      }
      #root {
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
        position: relative;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #fe7f2d; /* Brand Orange */
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ee6517;
      }
      .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* 3D Transform Utilities */
      .perspective-distant {
        perspective: 1000px;
      }
      .transform-3d {
        transform-style: preserve-3d;
      }

      /* Dark mode specific glows and animations */
      .glow-primary {
        box-shadow: 0 4px 20px -2px rgba(254, 127, 45, 0.12);
      }
      .dark .glow-primary {
        box-shadow: 0 4px 25px -2px rgba(254, 127, 45, 0.15);
      }
      .glow-accent {
        box-shadow: 0 4px 20px -2px rgba(35, 61, 77, 0.12);
      }
      .dark .glow-accent {
        box-shadow: 0 4px 25px -2px rgba(35, 61, 77, 0.15);
      }

      /* Card Border Beams & Shimmers */
      .border-glow-hover {
        position: relative;
        z-index: 1;
      }
      .border-glow-hover::before {
        content: '';
        position: absolute;
        inset: -1.5px;
        border-radius: inherit;
        background: linear-gradient(135deg, transparent 40%, rgba(254, 127, 45, 0.15), rgba(35, 61, 77, 0.15), transparent 60%);
        background-size: 200% 200%;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.5s ease, background-position 0.5s ease;
      }
      .border-glow-hover:hover::before {
        opacity: 1;
        background-position: 100% 100%;
      }

      /* High-end Grainy Gradient Background & Overlay */
      body {
        position: relative;
      }
      
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        opacity: 0.035;
        pointer-events: none;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      .dark body::before {
        opacity: 0.06;
      }

      .bg-grainy-gradient {
        background-color: #f4f5f7;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(254, 127, 45, 0.08) 0%, transparent 45%),
          radial-gradient(circle at 90% 15%, rgba(35, 61, 77, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(254, 127, 45, 0.04) 0%, transparent 50%),
          radial-gradient(rgba(254, 127, 45, 0.03) 1px, transparent 1px);
        background-size: auto, auto, auto, 24px 24px;
        background-attachment: fixed;
      }

      .dark .bg-grainy-gradient {
        background-color: #0b0c10;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(254, 127, 45, 0.06) 0%, transparent 45%),
          radial-gradient(circle at 90% 15%, rgba(35, 61, 77, 0.22) 0%, transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(254, 127, 45, 0.03) 0%, transparent 50%),
          radial-gradient(rgba(254, 127, 45, 0.01) 1px, transparent 1px);
        background-size: auto, auto, auto, 24px 24px;
        background-attachment: fixed;
      }

      /* Background grid patterns */
      .bg-grid-pattern {
        background-image: radial-gradient(rgba(254, 127, 45, 0.04) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .dark .bg-grid-pattern {
        background-image: radial-gradient(rgba(254, 127, 45, 0.02) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* Premium Glassmorphism */
      .glass-card {
        background: rgba(244, 245, 247, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(234, 236, 240, 0.5);
      }
      .dark .glass-card {
        background: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(234, 236, 240, 0.12);
      }

      /* Hover dynamic tilt effect */
      .tilt-hover {
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      }
      .tilt-hover:hover {
        transform: translateY(-4px) scale(1.01);
      }
    </style>
